<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dual Holder Model (Three.js)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
        }
    </style>
    <!-- Import Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
</head>
<body>
    <div id="info">
        <strong>Dual Bottle & Cuboid Holder</strong><br>
        • Bottle Ring: Hollow, 12.85 cm Inner Diameter<br>
        • Cuboid Pocket (Inner Dimension): 7.3 cm × 5 cm (Solid Base)<br>
        • Height: 6 cm<br>
        <span style="color: #aaa; font-size: 12px;">Drag to rotate | Scroll to zoom | Right-click to pan</span>
    </div>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        // 2. Camera Setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 25, 35);

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 4. Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 5. Lighting Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 0.3);
        fillLight.position.set(-20, -10, -20);
        scene.add(fillLight);

        // Grid Helper
        const grid = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
        grid.position.y = -3.5;
        scene.add(grid);

        // 6. Geometry Parameters (Scale: 1 unit = 1 cm)
        const bottleRadiusIn = 6.425; // 12.85cm diameter -> 6.425cm radius
        const wallThickness = 2;  // 8mm wall thickness
        const bottleRadiusOut = bottleRadiusIn + wallThickness;
        const holderHeight = 6.0;   // 6cm height
        
        const cuboidX = 7.3;        // 7.3cm width
        const cuboidY = 5.0;        // 5cm depth
        const baseThickness = 0.5;  // 5mm base

        const holderGroup = new THREE.Group();

        // Material for holder
        const holderMaterial = new THREE.MeshStandardMaterial({
            color: 0x2196f3,
            roughness: 0.3,
            metalness: 0.1
        });

        // --- A. Create Hollow Cylinder (Bottle Ring) ---
        const bottleShape = new THREE.Shape();
        bottleShape.absarc(0, 0, bottleRadiusOut, 0, Math.PI * 2, false);
        const bottleHole = new THREE.Path();
        bottleHole.absarc(0, 0, bottleRadiusIn, 0, Math.PI * 2, true);
        bottleShape.holes.push(bottleHole);

        const bottleGeometry = new THREE.ExtrudeGeometry(bottleShape, {
            depth: holderHeight,
            bevelEnabled: false,
            curveSegments: 64
        });
        bottleGeometry.rotateX(-Math.PI / 2);
        const bottleMesh = new THREE.Mesh(bottleGeometry, holderMaterial);
        bottleMesh.castShadow = true;
        bottleMesh.receiveShadow = true;
        holderGroup.add(bottleMesh);

        // --- B. Create Cuboid Housing (with Base) ---
        const offsetZ = bottleRadiusOut + (cuboidY / 2);

        const cuboidGroup = new THREE.Group();
        const outerWidth = cuboidX + (2 * wallThickness);

        // 1. Front Wall
        const frontWall = new THREE.Mesh(
            new THREE.BoxGeometry(outerWidth, holderHeight, wallThickness), 
            holderMaterial
        );
        frontWall.position.set(0, holderHeight / 2, offsetZ + (cuboidY / 2) + (wallThickness / 2));
        
        // 2. Back Wall (Profile cutout matching the bottle ring)
        const wallHalfW = outerWidth / 2;
        const wallDepth = wallThickness * 5;
        const wallCenterZ = offsetZ - (cuboidY / 2) - (wallThickness / 2) - 1;
        const wallZ1 = wallCenterZ + (wallDepth / 2);

        const backWallShape = new THREE.Shape();
        const arcSteps = 64;
        for (let i = 0; i <= arcSteps; i++) {
            const x = -wallHalfW + (2 * wallHalfW * i) / arcSteps;
            const z = Math.sqrt(bottleRadiusOut * bottleRadiusOut - x * x);
            if (i === 0) backWallShape.moveTo(x, -z); else backWallShape.lineTo(x, -z);
        }
        backWallShape.lineTo(wallHalfW, -wallZ1);
        backWallShape.lineTo(-wallHalfW, -wallZ1);
        backWallShape.closePath();

        const backWallGeometry = new THREE.ExtrudeGeometry(backWallShape, { depth: holderHeight, bevelEnabled: false });
        backWallGeometry.rotateX(-Math.PI / 2);
        const backWall = new THREE.Mesh(backWallGeometry, holderMaterial);

        // 3. Left & Right Walls
        const leftWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThickness, holderHeight, cuboidY), 
            holderMaterial
        );
        leftWall.position.set(-(cuboidX / 2) - (wallThickness / 2), holderHeight / 2, offsetZ);

        const rightWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThickness, holderHeight, cuboidY), 
            holderMaterial
        );
        rightWall.position.set((cuboidX / 2) + (wallThickness / 2), holderHeight / 2, offsetZ);

        // 4. Solid Base Floor
        const bottomBase = new THREE.Mesh(
            new THREE.BoxGeometry(cuboidX, baseThickness, cuboidY), 
            holderMaterial
        );
        bottomBase.position.set(0, baseThickness / 2, offsetZ);

        cuboidGroup.add(frontWall, backWall, leftWall, rightWall, bottomBase);
        
        cuboidGroup.traverse(child => {
            if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
            }
        });

        holderGroup.add(cuboidGroup);

        // Center holder vertically
        holderGroup.position.y = -holderHeight / 2;
        scene.add(holderGroup);

        // STL Export Button
        const exportBtn = document.createElement('button');
        exportBtn.textContent = 'Export STL';
        exportBtn.style.cssText = 'position:absolute;top:10px;right:10px;padding:8px 14px;cursor:pointer;';
        document.body.appendChild(exportBtn);

        exportBtn.onclick = () => {
            const exportGroup = holderGroup.clone();
            exportGroup.position.set(0, 0, 0);      
            exportGroup.scale.setScalar(10);        // 1 unit = 1 cm here, slicers expect mm
            exportGroup.rotation.x = Math.PI / 2;   // Three.js is Y-up, slicers are Z-up
            exportGroup.updateMatrixWorld(true);

            const stl = new THREE.STLExporter().parse(exportGroup, { binary: true });
            const blob = new Blob([stl], { type: 'application/octet-stream' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'holder.stl';
            a.click();
            URL.revokeObjectURL(a.href);
        };

        // 7. Animation & Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
